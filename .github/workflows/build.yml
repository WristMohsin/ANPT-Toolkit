name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ANPT-Toolkit.sln

      - name: Build
        run: dotnet build ANPT-Toolkit.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ANPT-Toolkit.sln --configuration Release --no-build --verbosity normal

      - name: Publish (self-contained Windows)
        run: |
          dotnet publish src/ANPT.UI/ANPT.UI.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output ./publish/ANPT-Toolkit

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ANPT-Toolkit-Windows
          path: publish/ANPT-Toolkit
          if-no-files-found: error
